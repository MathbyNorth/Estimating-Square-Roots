<script>

let currentNumber;
let currentRoot;

let score = 0;

let questionNumber = 1;

function startGame(){

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameArea").style.display = "block";

    generateQuestion();
}

function generateQuestion(){

    currentNumber = Math.floor(Math.random() * 400) + 1;

    while(Number.isInteger(Math.sqrt(currentNumber))){
        currentNumber = Math.floor(Math.random() * 400) + 1;
    }

    currentRoot = Math.sqrt(currentNumber);

    document.getElementById("question").innerHTML =
    "Estimate √" + currentNumber + " to the nearest tenth";

    document.getElementById("answer").value = "";
}

function submitAnswer(){

    let studentAnswer =
    parseFloat(document.getElementById("answer").value);

    if(isNaN(studentAnswer)){
        document.getElementById("feedback").innerHTML =
        "Please enter an estimate.";
        return;
    }

    if(Math.abs(studentAnswer - currentRoot) <= tolerance){
