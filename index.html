<script>

let currentNumber;
let currentRoot;

let score = 0;
let streak = 0;
let questionNumber = 1;

function startGame(){

    document.getElementById("menu").style.display="none";
    document.getElementById("gameArea").style.display="block";

    generateQuestion();
}

function generateQuestion(){

    currentNumber = Math.floor(Math.random()*400)+1;

    while(Number.isInteger(Math.sqrt(currentNumber))){
        currentNumber = Math.floor(Math.random()*400)+1;
    }

    currentRoot = Math.sqrt(currentNumber);

    document.getElementById("question").innerHTML =
    `Estimate √${currentNumber} to the nearest tenth`;

    document.getElementById("answer").value="";

    updateProgress();
}

function submitAnswer(){

    let student =
    parseFloat(document.getElementById("answer").value);

    if(isNaN(student)){
        document.getElementById("feedback").innerHTML =
        "Please enter an estimate.";
        return;
    }

    let tolerance = 0.15;

    if(Math.abs(student-currentRoot)<=tolerance){

        score++;
        streak++;

        document.getElementById("feedback").innerHTML =
        `✅ Correct! √${currentNumber} ≈ ${currentRoot.toFixed(2)}`;

    }
    else{

        streak=0;

        document.getElementById("feedback").innerHTML =
        `❌ Not quite. √${currentNumber} ≈ ${currentRoot.toFixed(2)}`;
    }

    document.getElementById("score").innerHTML = score;
    document.getElementById("streak").innerHTML = streak;
}
