<!DOCTYPE html>
<html>
<head>
<title>Estimating Square Roots</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#eef4ff;
padding:20px;
}

.container{
background:white;
max-width:800px;
margin:auto;
padding:20px;
border-radius:10px;
}

#gameArea{
display:none;
}

button{
padding:10px 15px;
margin:5px;
}
</style>

</head>
<body>

<div class="container">

<h1>Approximate Square Root Challenge V2</h1>

<div id="menu">

<button onclick="startGame()">
Start Game
</button>

</div>

<div id="gameArea">

<h2 id="question"></h2>

<input id="answer" type="number" step="0.1">

<br><br>

<button onclick="checkAnswer()">
Submit
</button>

<p id="feedback"></p>

</div>

</div>

<script>

let currentNumber;
let currentRoot;

function startGame(){

document.getElementById("menu").style.display="none";
document.getElementById("gameArea").style.display="block";

newQuestion();

}

function newQuestion(){

currentNumber=Math.floor(Math.random()*400)+1;

while(Number.isInteger(Math.sqrt(currentNumber))){
currentNumber=Math.floor(Math.random()*400)+1;
}

currentRoot=Math.sqrt(currentNumber);

document.getElementById("question").innerHTML=
"Estimate √" + currentNumber;

}

function checkAnswer(){

let answer=
parseFloat(document.getElementById("answer").value);

if(Math.abs(answer-currentRoot)<=0.15){

document.getElementById("feedback").innerHTML=
"✅ Correct";

}
else{

document.getElementById("feedback").innerHTML=
"❌ Answer: " + currentRoot.toFixed(2);

}

}

</script>

</body>
</html>
